name: Main Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  build:
    uses: FroeFam/ci-pipeline/.github/workflows/build-test.yml@v1
    with:
      language: dotnet
      solution: TalkingPointsSummary.sln
      unit-test-project: tests/TalkingPointsSummary.Tests/TalkingPointsSummary.Tests.csproj
      integration-test-project: tests/TalkingPointsSummary.IntegrationTests/TalkingPointsSummary.IntegrationTests.csproj
    secrets: inherit

  release:
    needs: build
    uses: FroeFam/ci-pipeline/.github/workflows/release.yml@v1
    with:
      registry: ghcr
      images: '[{"name":"talkingpointssummary-worker","dockerfile":"infra/Dockerfile","context":".","platforms":["linux/amd64"],"title":"TalkingPointsSummary Worker"},{"name":"talkingpointssummary-admin","dockerfile":"infra/Dockerfile.admin","context":".","platforms":["linux/amd64"],"title":"TalkingPointsSummary Admin"}]'
    secrets: inherit
